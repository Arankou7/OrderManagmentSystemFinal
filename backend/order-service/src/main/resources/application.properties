spring.application.name=order-service

server.port=8181
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.datasource.url=jdbc:postgresql://localhost:5433/order_db
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Existing local databases predate versioned migrations. Baseline them at V1,
# then apply V2 and later migrations normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

#here I build the Circuit Breaker props
resilience4j.circuitbreaker.instances.inventory.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.inventory.failureRateThreshold=50
resilience4j.circuitbreaker.instances.inventory.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.inventory.slidingWindowSize=5
resilience4j.circuitbreaker.instances.inventory.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.inventory.permittedNumberOfCallsInHalfOpenState=3
resilience4j.timelimiter.instances.inventory.timeoutDuration=3s

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/order-system-realm

# Demo order lifecycle automation: pending orders become delivered after a short delay.
orders.status-automation.enabled=false
orders.status-automation.finish-after-seconds=30
orders.status-automation.initial-delay-ms=10000
orders.status-automation.fixed-delay-ms=10000
