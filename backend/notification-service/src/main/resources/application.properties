spring.application.name=notification-service
server.port=8084

# Connect to RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Email delivery
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:5000}

notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:true}
notification.email.fail-on-error=${NOTIFICATION_EMAIL_FAIL_ON_ERROR:false}
notification.email.html-enabled=${NOTIFICATION_EMAIL_HTML_ENABLED:false}
notification.email.from=${MAIL_FROM:no-reply@order-system.local}
notification.email.reply-to=${MAIL_REPLY_TO:}
notification.email.subject-template=${NOTIFICATION_EMAIL_SUBJECT_TEMPLATE:Order {orderNumber} received}
notification.email.text-template=${NOTIFICATION_EMAIL_TEXT_TEMPLATE:Thank you for your order.\n\nOrder number: {orderNumber}\nCustomer email: {email}}
notification.email.html-template=${NOTIFICATION_EMAIL_HTML_TEMPLATE:<p>Thank you for your order.</p><p><strong>Order number:</strong> {orderNumber}</p><p><strong>Customer email:</strong> {email}</p>}

# Connect to Eureka
eureka.client.enabled=false

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
